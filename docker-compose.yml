version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arena_postgres
    environment:
      POSTGRES_USER: arena_user
      POSTGRES_PASSWORD: arena_password
      POSTGRES_DB: arena_poc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_user -d arena_poc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arena_network

  arena_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena_api
    environment:
      DATABASE_URL: postgresql://arena_user:arena_password@postgres:5432/arena_poc
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - arena_network

volumes:
  postgres_data:

networks:
  arena_network:
    driver: bridge